about:
  title: "About Me"
  description: |
    Tôi là một nhà phát triển đam mê xây dựng các ứng dụng web và giải quyết các vấn đề bằng code.
    Hành trình của tôi kết hợp trí tò mò với việc học tập nhất quán, biến các khái niệm thành các sản phẩm kỹ thuật số có mục đích và hữu dụng.


